x-pf-info:
  sub-profiles:
    - cuda
    - mqtt-public
  settings:
    PROJECT_PREFIX:
      default: ""
    APIGATEWAY_TAG:
      default: latest
    DBSERVER_TAG:
      default: latest
    REALTIME_TAG:
      default: latest
      default_var: REALTIME_TAG_DEFAULT_GPU
    AUDITGUI_TAG:
      default: latest
    WEBGUI_FORCE_GHOSTING:
      description: Force ghosting of all cameras
      default: true
    WEBGUI_UNGHOSTED_CAMERA_LIST:
      description: List of cameras that should not be ghosted. Should be a comma separated list of camera names
      default: ""
    WEBGUI_DEFAULT_GHOSTING_TYPE:
      description: "Ghosting style the webgui starts with. One of: no_image, edges, edges_inverted, ghosted, ghosted_blur, color_invert"
      default: ghosted
    DBSERVER_DISABLE_SNAPSHOT_IMAGES:
      description: Disable unghosted snapshot image endpoints in dbserver (hard ghosting enforcement)
      default: true
    AUDIT_PROCESSING_TAG:
      default: "latest"
    PF_REPORT_RANGE_HOURS:
      description: Time window audit processing will compute retroactively (hours)
      default: 168
    PF_PROCESS_BLOCK_DURATION_MINUTES:
      description: Size of blocks audit processing will compute (minutes)
      default: 15
    PF_PROCESS_BLOCK_PREVIOUS_MINUTES:
      description: Duration of redundant/overlapping data precedeing each processing block's start time (minutes)
      default: 5
    PF_PROCESS_BLOCK_LAG_MINUTES:
      description: Duration to wait after end of a processing block for late-arriving data to arrive in dbserver (minutes)
      default: 5
    PF_PROCESS_BLOCK_MAX_LOOKBACK_MINUTES:
      description: Upper bound on the per-entry source-data lookback derived from duration parameters in each entry's dependency chain (minutes)
      default: 240
    PF_ENABLE_SEGMENT_TRIM_STITCH:
      description: Globally enable per-entry segment trimming, stitching, and derived source-data lookback in audit processing (true/false)
      default: false
    PF_SOURCE_CACHE_ENTRIES_PER_CAMERA:
      description: Audit processing's shared source-data cache bound, in payloads retained per camera (keep >= PF_PROCESS_BLOCK_CONCURRENCY + 1; 0 disables the cache)
      default: 4
    GIFWRAPPER_TAG:
      default: latest
    DTREESERVER_TAG:
      default: latest
    PF_MOSQUITTO_TAG:
      default: latest
    DATA_INTERCONNECTOR_TAG:
      default: latest
    MONGO_MEMORY_LIMIT:
      description: Hard memory limit for the mongo container, with units (e.g. 3g). Default scales with host RAM; see MONGODB.md for sizing guidance
      default: 3g
      default_var: MONGO_MEMORY_LIMIT_DEFAULT
    MONGO_WIREDTIGER_CACHE_GB:
      description: MongoDB WiredTiger cache size in GB. Rule of thumb is 50% of (MONGO_MEMORY_LIMIT - 1GB). Default scales with host RAM
      default: 1
      default_var: MONGO_WIREDTIGER_CACHE_GB_DEFAULT
    MONGO_OPLOG_SIZE_MB:
      description: Maximum size (in MB) of the MongoDB replica set oplog
      default: 2048
    HTTP_PORT:
      default: 80

services:
  mongo:
    container_name: ${PROJECT_PREFIX:-}mongo
    hostname: ${PROJECT_PREFIX:-}mongo
    image: mongo:4.2.3-bionic
    restart: always
    # Memory bounding + single-node replica set (see MONGODB.md for details)
    # - wiredTigerCacheSizeGB must be set explicitly, since mongod 4.2 cannot
    #   detect container memory limits and would otherwise size its cache
    #   from the *host* RAM (unbounded growth -> host OOM killer events)
    # - replSet/oplogSize run mongo as a single-node replica set, which gives
    #   journal-acknowledged (crash-durable) writes, retryable writes and
    #   change streams; the replica set is initialized by the healthcheck below
    command:
      - "mongod"
      - "--quiet"
      - "--slowms"
      - "200"
      - "--wiredTigerCacheSizeGB"
      - "${MONGO_WIREDTIGER_CACHE_GB:-${MONGO_WIREDTIGER_CACHE_GB_DEFAULT:-1}}"
      - "--replSet"
      - "rs0"
      - "--oplogSize"
      - "${MONGO_OPLOG_SIZE_MB:-2048}"
    # Hard cap so a misbehaving mongod is restarted by docker (restart: always)
    # instead of growing until the host OOM killer takes out arbitrary processes
    deploy:
      resources:
        limits:
          memory: ${MONGO_MEMORY_LIMIT:-${MONGO_MEMORY_LIMIT_DEFAULT:-3g}}
    # The healthcheck reports healthy only when the node is PRIMARY. As a side
    # effect it initializes the single-node replica set on first boot (code 94,
    # NotYetInitialized) and re-binds the replica set config if the container
    # hostname changes, e.g. after a PROJECT_PREFIX change (code 93,
    # InvalidReplicaSetConfig)
    healthcheck:
      test:
        - "CMD"
        - "mongo"
        - "--quiet"
        - "--eval"
        - |
          var self_host = getHostName() + ":27017";
          var status;
          try { status = rs.status(); } catch (rs_error) { status = rs_error; }
          if (status.ok === 1 && status.myState === 1) { quit(0); }
          if (status.code === 94) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: self_host }] });
          } else if (status.code === 93) {
            var cfg = db.getSiblingDB("local").system.replset.findOne();
            cfg.members = [{ _id: 0, host: self_host }];
            cfg.version += 1;
            db.adminCommand({ replSetReconfig: cfg, force: true });
          }
          quit(1);
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    # Increase open file handle limits (https://github.com/pacefactory/deployment-scripts/issues/94)
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    logging:
      driver: local
    expose:
      - "27017"
    volumes:
      # Old path for the volume, prior to using a proper docker volume
      # - "~/scv2/volumes/mongo:/data/db"
      - mongodata:/data/db
    networks:
      - internal_network

  dbserver:
    container_name: ${PROJECT_PREFIX:-}dbserver
    hostname: ${PROJECT_PREFIX:-}dbserver
    image: pacefactory/dbserver:${DBSERVER_TAG:-latest}
    restart: always
    logging:
      driver: local
    depends_on:
      - mongo
    stdin_open: true
    tty: true
    environment:
      - "MONGO_HOST=${PROJECT_PREFIX:-}mongo"
      - "DBSERVER_DISABLE_SNAPSHOT_IMAGES=${DBSERVER_DISABLE_SNAPSHOT_IMAGES:-true}"
    volumes:
      - "dbserver-data:/home/scv2/volume"
    networks:
      - internal_network
      - external_network

  pf_mosquitto:
    container_name: ${PROJECT_PREFIX:-}pf_mosquitto
    hostname: ${PROJECT_PREFIX:-}pf_mosquitto
    image: pacefactory/pf_mosquitto:${PF_MOSQUITTO_TAG:-latest}
    restart: always
    logging:
      driver: local
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-t",
          "healthcheck/ping",
          "-m",
          "ok",
          "-u",
          "admin",
          "-P",
          "pfadminpw",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - mosquitto-data:/mosquitto
    networks:
      - external_network

  data_interconnector:
    container_name: ${PROJECT_PREFIX:-}data_interconnector
    hostname: ${PROJECT_PREFIX:-}data_interconnector
    image: pacefactory/data_interconnector:${DATA_INTERCONNECTOR_TAG:-latest}
    restart: always
    logging:
      driver: local
    depends_on:
      - pf_mosquitto
      - mongo
    environment:
      - "PF_MQTT_HOST=${PROJECT_PREFIX:-}pf_mosquitto"
      - "PF_MQTT_PORT=1883"
      - "PF_MONGO_HOST=${PROJECT_PREFIX:-}mongo"
      - "PF_MONGO_PORT=27017"
      - "PF_UISERVER_URL=http://${PROJECT_PREFIX:-}auditgui:80"
      # TEMP: We disable uiserver use until we complete the implementation of downstream microbatch processing
      - "PF_UISERVER_DISABLED=1"
    volumes:
      - data_interconnector-data:/home/scv2/volume
    networks:
      - internal_network
      - external_network

  realtime:
    container_name: ${PROJECT_PREFIX:-}realtime
    image: pacefactory/realtime:${REALTIME_TAG:-${REALTIME_TAG_DEFAULT_GPU:-latest}}
    hostname: ${PROJECT_PREFIX:-}realtime
    restart: always
    logging:
      driver: local
    depends_on:
      - pf_mosquitto
      - data_interconnector
    stdin_open: true
    tty: true
    environment:
      - "DBSERVER_HOST=${PROJECT_PREFIX:-}dbserver"
      - "REALTIME_APIGATEWAY=true"
      - "MQTT_BROKER_HOST=${PROJECT_PREFIX:-}pf_mosquitto"
      - "MQTT_BROKER_PORT=1883"
      - "DBSERVER_DOCKER_VOLUME_DATA_PATH=/home/scv2/dbserver_volume/data"
    volumes:
      - "realtime-data:/home/scv2/locations"
      - "dbserver-data:/home/scv2/dbserver_volume"
    networks:
      - external_network

  auditgui:
    container_name: ${PROJECT_PREFIX:-}auditgui
    hostname: ${PROJECT_PREFIX:-}auditgui
    image: pacefactory/scv3_webgui:${AUDITGUI_TAG:-latest}
    restart: always
    logging:
      driver: local
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:80/health-check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - dbserver
      - service_gifwrapper
      - service_dtreeserver
    environment:
      - "WEBGUI_APIGATEWAY=true"
      - "WEBGUI_FORCE_GHOSTING=${WEBGUI_FORCE_GHOSTING:-true}"
      - "WEBGUI_UNGHOSTED_CAMERA_LIST=${WEBGUI_UNGHOSTED_CAMERA_LIST:-}"
      - "WEBGUI_DEFAULT_GHOSTING_TYPE=${WEBGUI_DEFAULT_GHOSTING_TYPE:-ghosted}"
      - "WEBGUI_RETRIEVE_REALTIME_CAM_CONFIG_ON_INIT=${WEBGUI_RETRIEVE_REALTIME_CAM_CONFIG_ON_INIT:-false}"
      - "WEBGUI_OBJ_REQ_BATCH_SIZE=${WEBGUI_OBJ_REQ_BATCH_SIZE:-20}"
      - "WEBGUI_WORK_QUEUE_INSERTION_MODE=${WEBGUI_WORK_QUEUE_INSERTION_MODE:-depth-first}"
      - "WEBGUI_OBJECT_METADATA_DOWNSAMPLE_FACTOR=${WEBGUI_OBJECT_METADATA_DOWNSAMPLE_FACTOR:-0.1}"
      - "WEBGUI_SPLIT_BATCH_MIN_DURATION_MS=${WEBGUI_SPLIT_BATCH_MIN_DURATION_MS:-300000}"
      - "WEBGUI_SPLIT_BATCH_TARGET_COUNT=${WEBGUI_SPLIT_BATCH_TARGET_COUNT:-5}"
      - "WEBGUI_STATIC_PATH=/scv3/static/"
      - "WEBGUI_BASE_PATH=/scv3"
      - "WEBGUI_SOCIAL_WEB_APP_URL=/"
    volumes:
      - "webgui-data:/home/scv2/volume"
    networks:
      - external_network

  service_gifwrapper:
    container_name: ${PROJECT_PREFIX:-}service_gifwrapper
    image: pacefactory/service-gifwrapper:${GIFWRAPPER_TAG:-latest}
    restart: always
    logging:
      driver: local
    depends_on:
      - dbserver
    environment:
      - "DBSERVER_HOST=${PROJECT_PREFIX:-}dbserver"
      - "DBSERVER_DISABLE_SNAPSHOT_IMAGES=${DBSERVER_DISABLE_SNAPSHOT_IMAGES:-true}"
      - "DBSERVER_VOLUME_DATA_PATH=/home/scv2/volume/data"
    volumes:
      - "dbserver-data:/home/scv2/volume:ro"
    networks:
      - external_network

  service_dtreeserver:
    container_name: ${PROJECT_PREFIX:-}service_dtreeserver
    image: pacefactory/service-dtreeserver:${DTREESERVER_TAG:-latest}
    restart: always
    logging:
      driver: local
    depends_on:
      - dbserver
    environment:
      - "DBSERVER_HOST=${PROJECT_PREFIX:-}dbserver"
    volumes:
      - "service_dtreeserver-data:/home/scv2/volume"
    networks:
      - external_network

  service_audit_processing:
    container_name: ${PROJECT_PREFIX:-}service_audit_processing
    image: pacefactory/service-audit-processing:${AUDIT_PROCESSING_TAG:-latest}
    restart: always
    logging:
      driver: local
    depends_on:
      - dbserver
      - auditgui
      - service_dtreeserver
      - pf_mosquitto
    environment:
      - "PF_DEBUG=false"
      - "PF_DBSERVER_URL=http://${PROJECT_PREFIX:-}dbserver:8050"
      - "PF_UISERVER_URL=http://${PROJECT_PREFIX:-}auditgui:80"
      - "PF_DTREE_CLASSIFIER_URL=http://${PROJECT_PREFIX:-}service_dtreeserver:7272"
      - "PF_MQTT_URL=http://${PROJECT_PREFIX:-}pf_mosquitto:1883"
      - "PF_REPORT_RANGE_HOURS=${PF_REPORT_RANGE_HOURS:-168}"
      - "PF_PROCESS_BLOCK_DURATION_MINUTES=${PF_PROCESS_BLOCK_DURATION_MINUTES:-15}"
      - "PF_PROCESS_BLOCK_PREVIOUS_MINUTES=${PF_PROCESS_BLOCK_PREVIOUS_MINUTES:-5}"
      - "PF_PROCESS_BLOCK_LAG_MINUTES=${PF_PROCESS_BLOCK_LAG_MINUTES:-5}"
      - "PF_PROCESS_BLOCK_MAX_LOOKBACK_MINUTES=${PF_PROCESS_BLOCK_MAX_LOOKBACK_MINUTES:-240}"
      - "PF_ENABLE_SEGMENT_TRIM_STITCH=${PF_ENABLE_SEGMENT_TRIM_STITCH:-false}"
      - "PF_SOURCE_CACHE_ENTRIES_PER_CAMERA=${PF_SOURCE_CACHE_ENTRIES_PER_CAMERA:-4}"
    volumes:
      - "audit_processing-data:/home/scv2/volume"
    networks:
      - external_network

  apigateway:
    container_name: ${PROJECT_PREFIX:-}apigateway
    hostname: ${PROJECT_PREFIX:-}apigateway
    image: pacefactory/apigateway:${APIGATEWAY_TAG:-latest}
    restart: always
    logging:
      driver: local
    environment:
      - "DBSERVER_HOST=${PROJECT_PREFIX:-}dbserver"
      - "DBSERVER_PORT=8050"
      - "DTREE_HOST=${PROJECT_PREFIX:-}service_dtreeserver"
      - "DTREE_PORT=7272"
      - "GIF_HOST=${PROJECT_PREFIX:-}service_gifwrapper"
      - "GIF_PORT=7171"
      - "REALTIME_HOST=${PROJECT_PREFIX:-}realtime"
      - "REALTIME_PORT=8181"
      - "AUDITGUI_HOST=${PROJECT_PREFIX:-}auditgui"
      - "AUDITGUI_PORT=80"
      - "AUDITPROC_HOST=${PROJECT_PREFIX:-}service_audit_processing"
      - "AUDITPROC_PORT=3005"
      - "SCV2_PROFILE_PF_MOSQUITTO=true"
      - "PF_MOSQUITTO_HOST=${PROJECT_PREFIX:-}pf_mosquitto"
      - "PF_MOSQUITTO_WEBSOCKETS_PORT=7575"
    depends_on:
      - dbserver
      - service_dtreeserver
      - service_gifwrapper
      - auditgui
      - service_audit_processing
      - pf_mosquitto
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - external_network

volumes:
  mongodata:
  dbserver-data:
  realtime-data:
  service_dtreeserver-data:
  webgui-data:
  mosquitto-data:
  data_interconnector-data:
  audit_processing-data:

networks:
  internal_network:
  external_network:
