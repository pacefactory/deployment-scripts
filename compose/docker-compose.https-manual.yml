x-pf-info:
  name: HTTPS (Manual)
  prompt: Enable HTTPS (via manual DNS)
  description: Manually provision HTTPS certificate via letsencrypt.
    MQTTS is auto-enabled on port ${MQTTS_PUBLIC_PORT:-8883} using the same certs.
  settings:
    SERVER_NAME:
      description: Final domain name will be SERVER_NAME
      default: ""
    LETSENCRYPT_EMAIL:
      description: Email address to use for letsencrypt.com
      default: ""
    HTTPS_PORT:
      default: 443
    MQTTS_PUBLIC_PORT:
      description: Public port for MQTTS (TLS over MQTT). Set blank to disable.
      default: 8883

services:
  certbot:
    container_name: ${PROJECT_PREFIX:-}certbot
    image: certbot/certbot
    profiles:
      - https-manual
    command:
      - "certonly"
      - "--manual"
      - --preferred-challenges
      - "dns"
      - "--keep-until-expiring"
      - "--expand"
      - "--agree-tos"
      - "--eff-email"
      - "-m"
      - "${LETSENCRYPT_EMAIL}"
      - "-d"
      - "${SERVER_NAME}"
    logging:
      driver: local
    volumes:
      - certbot:/etc/letsencrypt/:rw

  apigateway:
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - certbot:/etc/nginx/ssl/:ro
    environment:
      - "SCV2_PROFILE_SSL=true"
      - "SERVER_NAME=${SERVER_NAME}"

  pf_mosquitto:
    ports:
      - "${MQTTS_PUBLIC_PORT:-8883}:8883"
    volumes:
      - certbot:/mosquitto/ssl/:ro
    environment:
      - "SERVER_NAME=${SERVER_NAME}"

volumes:
  certbot:
