x-pf-info:
  name: Expresso profile
  # Always enabled — build.sh force-enables this profile without prompting.
  description: The Expresso profile provides expresso_server and the Expresso UI
  sub-profiles:
    - expresso-020-cuda
    - expresso-030-trainer
  settings:
    EXPRESSO_SERVER_TAG:
      default: latest
      default_var: EXPRESSO_SERVER_TAG_DEFAULT_GPU
    EXPRESSO_UI_TAG:
      default: latest
    EXPRESSO_UI_PASSWORD_PROTECTION:
      description: Enable Expresso UI password protection (true/false)
      default: true
    PF_EXPRESSO_PUBLIC_URL_BASE:
      description: >-
        Public URL other deployments use to reach this one for remote-training
        callbacks, including scheme and the /api/expresso prefix
        (e.g. https://site.example.com/api/expresso). Leave blank if this
        deployment will not dispatch training to a remote.
      default: ""
    PF_REMOTE_TRAINER_URLS:
      description: >-
        Optional comma-separated remote Expresso base URLs to pre-register as
        remote trainers (e.g. https://siteB.example.com/api/expresso,https://siteC.example.com/api/expresso).
        Leave blank to add them later via the UI/API.
      default: ""

services:
  expresso_server:
    container_name: ${PROJECT_PREFIX:-}expresso_server
    hostname: ${PROJECT_PREFIX:-}expresso_server
    image: pacefactory/expresso_server:${EXPRESSO_SERVER_TAG:-${EXPRESSO_SERVER_TAG_DEFAULT_GPU:-latest}}
    restart: always
    logging:
      driver: local
    volumes:
      - expresso-data:/home/scv2/volume
      # Read-only mount of the dbserver data volume so the stations config UI
      # can fetch snapshot JPEGs directly from disk when DBSERVER_DISABLE_SNAPSHOT_IMAGES
      # is true on the dbserver (the default). Same strategy as service_gifwrapper.
      - "dbserver-data:/home/scv2/dbserver_volume:ro"
    # Ports are conditionally enabled in the expresso-ports profile
    networks:
      - external_network
      - expresso_network
    environment:
      - "PF_APIGATEWAY=true"
      - "PF_ROOT_PATH=/api/expresso"
      - "PF_REDIS_HOST=${PROJECT_PREFIX:-}redis"
      - PF_UISERVER_URL=http://${PROJECT_PREFIX:-}auditgui:80
      - PF_MONGO_HOST=${PROJECT_PREFIX:-}mongo_exp
      - PF_CONTROL_SERVER_HOST=${PROJECT_PREFIX:-}realtime
      - PF_CONTROL_SERVER_PORT=8181
      # Override to connect directly to the control server (for development).
      # When empty, falls back to CONTROL_SERVER_HOST and CONTROL_SERVER_PORT
      - "PF_CONTROL_SERVER_URL="
      - PF_DBSERVER_HOST=${PROJECT_PREFIX:-}dbserver
      - PF_DBSERVER_PORT=8050
      # The PF_DBSERVER_URL overrides the DBSERVER_HOST and DBSERVER_PORT.
      # The DBSERVER_URL is meant to be used for development.
      - "PF_DBSERVER_URL="
      # Root of the mounted dbserver data volume. When set, expresso_server
      # reads snapshot images directly from disk rather than via the dbserver
      # HTTP API, which is disabled by default for privacy
      # (DBSERVER_DISABLE_SNAPSHOT_IMAGES=true).
      - "PF_DBSERVER_VOLUME_DATA_PATH=/home/scv2/dbserver_volume/data"
      # Social video server connection (used for user-engagement metrics). Only
      # reachable when the social profile is deployed (docker-compose.social.yml);
      # expresso_server tolerates it being unreachable otherwise.
      - PF_SOCIAL_VIDEO_SERVER_HOST=${PROJECT_PREFIX:-}social_video_server
      - PF_SOCIAL_VIDEO_SERVER_PORT=9999
      # The PF_SOCIAL_VIDEO_SERVER_URL overrides the SOCIAL_VIDEO_SERVER_HOST and
      # SOCIAL_VIDEO_SERVER_PORT. Meant to be used for development.
      - "PF_SOCIAL_VIDEO_SERVER_URL="
      # Externally-reachable base URL of THIS deployment, used to build the
      # remote-training callback endpoint (<base>/training/remote/callback).
      # Empty = this deployment cannot originate remote training jobs
      # (local training still works).
      - "PF_EXPRESSO_PUBLIC_URL_BASE=${PF_EXPRESSO_PUBLIC_URL_BASE:-}"
      # Optional comma-separated remote Expresso base URLs pre-registered as
      # remote trainers at startup (idempotent).
      - "PF_REMOTE_TRAINER_URLS=${PF_REMOTE_TRAINER_URLS:-}"

    depends_on:
      mongo:
        condition: service_started
        required: true
      celery_worker:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true

  expresso_ui:
    container_name: ${PROJECT_PREFIX:-}expresso_ui
    hostname: ${PROJECT_PREFIX:-}expresso_ui
    image: pacefactory/expresso_ui:${EXPRESSO_UI_TAG:-latest}
    restart: always
    logging:
      driver: local
    # Ports are conditionally enabled in the expresso-ports profile
    networks:
      - external_network
    environment:
      - "PF_APIGATEWAY=true"
      - "PF_EXPRESSO_SERVER_PORT=8456"
      - "PF_EXPRESSO_SERVER_HOST="
      # The EXPRESSO_SERVER_URL overrides apigateway when connecting to the expresso server.
      # Overrides the PF_EXPRESSO_SERVER_PORT and PF_EXPRESSO_SERVER_HOST too.
      - "PF_EXPRESSO_SERVER_URL="
      - "PF_CONTROL_SERVER_URL="
      - "PF_APE_URL="
      # The PF_GIF_URL overrides apigateway when connecting to the gifwrapper service
      # (used for ghosted snapshot images). With apigateway enabled the UI uses
      # /api/gif/, so this is left empty; it is meant to be used for development.
      - "PF_GIF_URL="
      # MQTT broker for the browser (websockets, not the raw 1883 port the worker uses).
      # The PF_MQTT_URL overrides apigateway when connecting to the broker; it must be a
      # ws:// or wss:// URL reachable from the browser. Overrides PF_MQTT_HOST and
      # PF_MQTT_WEBSOCKETS_PORT too. With apigateway enabled the UI uses /api/mqtt/, so the
      # host is left empty; it only applies in gateway-less deployments and must then be a
      # hostname the browser can resolve (not the docker service name).
      - "PF_MQTT_URL="
      - "PF_MQTT_HOST="
      - "PF_MQTT_WEBSOCKETS_PORT=7575"
      # Set to false to remove the password prompt that gates the entire UI.
      - "PF_PASSWORD_PROTECTION=${EXPRESSO_UI_PASSWORD_PROTECTION:-true}"
    depends_on:
      expresso_server:
        condition: service_started
        required: true
      realtime:
        condition: service_started
        required: false

  auditgui:
    environment:
      # Base URL of the expresso UI behind the apigateway, used by the webgui
      # to link to the expresso UI (e.g. the site reliability page).
      - "WEBGUI_EXPRESSO_UI_URL=/expresso"

  redis:
    container_name: ${PROJECT_PREFIX:-}redis
    hostname: ${PROJECT_PREFIX:-}redis
    image: redis:8.2.1-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - expresso_network

  celery_worker:
    container_name: ${PROJECT_PREFIX:-}celery_worker
    hostname: ${PROJECT_PREFIX:-}celery_worker
    image: pacefactory/expresso_server:${EXPRESSO_SERVER_TAG:-${EXPRESSO_SERVER_TAG_DEFAULT_GPU:-latest}}
    entrypoint: ["./scripts/start_worker.sh"]
    restart: always
    logging:
      driver: local
    volumes:
      - expresso-data:/home/scv2/volume
    # Ports are conditionally enabled in the expresso-ports profile
    networks:
      - external_network
      - expresso_network
    environment:
      - "PF_REDIS_HOST=${PROJECT_PREFIX:-}redis"
      - PF_MONGO_HOST=${PROJECT_PREFIX:-}mongo_exp
      - PF_CONTROL_SERVER_HOST=${PROJECT_PREFIX:-}realtime
      - PF_CONTROL_SERVER_PORT=8181
      # Override to connect directly to the control server (for development).
      # When empty, falls back to CONTROL_SERVER_HOST and CONTROL_SERVER_PORT
      - "PF_CONTROL_SERVER_URL="
      - PF_DBSERVER_HOST=${PROJECT_PREFIX:-}dbserver
      - PF_DBSERVER_PORT=8050
      # The PF_DBSERVER_URL overrides the DBSERVER_HOST and DBSERVER_PORT.
      # The DBSERVER_URL is meant to be used for development.
      - "PF_DBSERVER_URL="
      # MQTT broker used by periodic publishing tasks (e.g. site reliability).
      # When PF_MQTT_HOST is empty, publishing is disabled.
      - "PF_MQTT_HOST=${PROJECT_PREFIX:-}pf_mosquitto"
      - "PF_MQTT_PORT=1883"
      # The site-reliability snapshot includes the audit app's version info, read from uiserver.
      - PF_UISERVER_URL=http://${PROJECT_PREFIX:-}auditgui:80
    depends_on:
      mongo_exp:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true

  # Singleton: never scale this service. Two beat replicas would enqueue every
  # scheduled task twice.
  celery_beat:
    container_name: ${PROJECT_PREFIX:-}celery_beat
    hostname: ${PROJECT_PREFIX:-}celery_beat
    image: pacefactory/expresso_server:${EXPRESSO_SERVER_TAG:-${EXPRESSO_SERVER_TAG_DEFAULT_GPU:-latest}}
    entrypoint: ["./scripts/start_beat.sh"]
    restart: always
    logging:
      driver: local
    networks:
      - expresso_network
    environment:
      - "PF_REDIS_HOST=${PROJECT_PREFIX:-}redis"
      - PF_MONGO_HOST=${PROJECT_PREFIX:-}mongo_exp
    depends_on:
      redis:
        condition: service_started
        required: true

  mongo_exp:
    container_name: ${PROJECT_PREFIX:-}mongo_exp
    hostname: ${PROJECT_PREFIX:-}mongo_exp
    image: mongodb/mongodb-community-server:8.2.1-ubi8
    restart: always
    networks:
      - expresso_network
    volumes:
      - type: volume
        source: mongodata_exp
        target: /data/db
        volume: {}

  apigateway:
    depends_on:
      - expresso_server
      - expresso_ui
    environment:
      - "SCV2_PROFILE_EXPRESSO=true"
      - "EXPRESSO_SERVER_HOST=${PROJECT_PREFIX:-}expresso_server"
      - "EXPRESSO_SERVER_PORT=8456"
      - "EXPRESSO_UI_HOST=${PROJECT_PREFIX:-}expresso_ui"
      - "EXPRESSO_UI_PORT=80"

volumes:
  expresso-data:
  mongodata_exp:

networks:
  expresso_network:
