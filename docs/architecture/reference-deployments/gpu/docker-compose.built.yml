# BUILD OUTPUT - do not edit by hand.
# Generated by scripts/docs/build-reference-deployment.sh from the .env and
# .settings in this directory. Re-run that script to update.
name: deployment-scripts
services:
  apigateway:
    container_name: apigateway
    depends_on:
      auditgui:
        condition: service_started
        required: true
      dbserver:
        condition: service_started
        required: true
      expresso_server:
        condition: service_started
        required: true
      expresso_ui:
        condition: service_started
        required: true
      nodered:
        condition: service_started
        required: true
      pf_mosquitto:
        condition: service_started
        required: true
      relational_dbserver:
        condition: service_started
        required: true
      service_audit_processing:
        condition: service_started
        required: true
      service_dtreeserver:
        condition: service_started
        required: true
      service_gifwrapper:
        condition: service_started
        required: true
      social_video_server:
        condition: service_started
        required: true
      social_web_app:
        condition: service_started
        required: true
    environment:
      AUDITGUI_HOST: auditgui
      AUDITGUI_PORT: "80"
      AUDITPROC_HOST: service_audit_processing
      AUDITPROC_PORT: "3005"
      DBSERVER_HOST: dbserver
      DBSERVER_PORT: "8050"
      DTREE_HOST: service_dtreeserver
      DTREE_PORT: "7272"
      EXPRESSO_SERVER_HOST: expresso_server
      EXPRESSO_SERVER_PORT: "8456"
      EXPRESSO_UI_HOST: expresso_ui
      EXPRESSO_UI_PORT: "80"
      GIF_HOST: service_gifwrapper
      GIF_PORT: "7171"
      NODERED_HOST: nodered
      NODERED_PORT: "1880"
      PF_MOSQUITTO_HOST: pf_mosquitto
      PF_MOSQUITTO_WEBSOCKETS_PORT: "7575"
      RDB_HOST: relational_dbserver
      RDB_PORT: "8282"
      REALTIME_HOST: realtime
      REALTIME_PORT: "8181"
      SCV2_PROFILE_EXPRESSO: "true"
      SCV2_PROFILE_NODERED: "true"
      SCV2_PROFILE_PF_MOSQUITTO: "true"
      SCV2_PROFILE_RDB: "true"
      SCV2_PROFILE_SOCIAL: "true"
      SOCIAL_VIDEO_SERVICE_HOST: social_video_server:9999
      SOCIAL_VIDO_APP_HOST: social_web_app
    hostname: apigateway
    image: pacefactory/apigateway:latest
    logging:
      driver: local
    networks:
      external_network: null
    ports:
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
    restart: always
  auditgui:
    container_name: auditgui
    depends_on:
      dbserver:
        condition: service_started
        required: true
      service_dtreeserver:
        condition: service_started
        required: true
      service_gifwrapper:
        condition: service_started
        required: true
    environment:
      WEBGUI_APIGATEWAY: "true"
      WEBGUI_BASE_PATH: /scv3
      WEBGUI_DEFAULT_GHOSTING_TYPE: ghosted
      WEBGUI_EXPRESSO_UI_URL: /expresso
      WEBGUI_FORCE_GHOSTING: "true"
      WEBGUI_OBJ_REQ_BATCH_SIZE: "20"
      WEBGUI_OBJECT_METADATA_DOWNSAMPLE_FACTOR: "0.1"
      WEBGUI_RDB_URL: /api/rdb
      WEBGUI_RETRIEVE_REALTIME_CAM_CONFIG_ON_INIT: "false"
      WEBGUI_SOCIAL_WEB_APP_URL: /
      WEBGUI_SPLIT_BATCH_MIN_DURATION_MS: "300000"
      WEBGUI_SPLIT_BATCH_TARGET_COUNT: "5"
      WEBGUI_STATIC_PATH: /scv3/static/
      WEBGUI_UNGHOSTED_CAMERA_LIST: ""
      WEBGUI_WORK_QUEUE_INSERTION_MODE: depth-first
    hostname: auditgui
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:80/health-check || exit 1
      timeout: 5s
      interval: 10s
      retries: 3
    image: pacefactory/scv3_webgui:latest
    logging:
      driver: local
    networks:
      external_network: null
    restart: always
    volumes:
      - type: volume
        source: webgui-data
        target: /home/scv2/volume
        volume: {}
  celery_beat:
    container_name: celery_beat
    depends_on:
      redis:
        condition: service_started
        required: true
    entrypoint:
      - ./scripts/start_beat.sh
    environment:
      PF_MONGO_HOST: mongo_exp
      PF_REDIS_HOST: redis
    hostname: celery_beat
    image: pacefactory/expresso_server:latest-gpu
    logging:
      driver: local
    networks:
      expresso_network: null
    restart: always
  celery_worker:
    container_name: celery_worker
    depends_on:
      mongo_exp:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
                - utility
                - compute
                - video
              driver: nvidia
              count: -1
    entrypoint:
      - ./scripts/start_worker.sh
    environment:
      PF_CONTROL_SERVER_HOST: realtime
      PF_CONTROL_SERVER_PORT: "8181"
      PF_CONTROL_SERVER_URL: ""
      PF_DBSERVER_HOST: dbserver
      PF_DBSERVER_PORT: "8050"
      PF_DBSERVER_URL: ""
      PF_GIFWRAPPER_HOST: service_gifwrapper
      PF_GIFWRAPPER_PORT: "7171"
      PF_IDLE_ARCHIVE_ENABLED: "true"
      PF_MONGO_HOST: mongo_exp
      PF_MQTT_HOST: pf_mosquitto
      PF_MQTT_PORT: "1883"
      PF_PREFER_GPU: "true"
      PF_REDIS_HOST: redis
      PF_UISERVER_URL: http://auditgui:80
    hostname: celery_worker
    image: pacefactory/expresso_server:latest-gpu
    logging:
      driver: local
    networks:
      expresso_network: null
      external_network: null
    restart: always
    volumes:
      - type: volume
        source: expresso-data
        target: /home/scv2/volume
        volume: {}
  data_interconnector:
    container_name: data_interconnector
    depends_on:
      mongo:
        condition: service_started
        required: true
      pf_mosquitto:
        condition: service_started
        required: true
    environment:
      PF_MONGO_HOST: mongo
      PF_MONGO_PORT: "27017"
      PF_MQTT_HOST: pf_mosquitto
      PF_MQTT_PORT: "1883"
      PF_UISERVER_DISABLED: "1"
      PF_UISERVER_URL: http://auditgui:80
    hostname: data_interconnector
    image: pacefactory/data_interconnector:latest
    logging:
      driver: local
    networks:
      external_network: null
      internal_network: null
    restart: always
    volumes:
      - type: volume
        source: data_interconnector-data
        target: /home/scv2/volume
        volume: {}
  dbserver:
    container_name: dbserver
    depends_on:
      mongo:
        condition: service_started
        required: true
    environment:
      DBSERVER_DISABLE_SNAPSHOT_IMAGES: "true"
      MONGO_HOST: mongo
    hostname: dbserver
    image: pacefactory/dbserver:latest
    logging:
      driver: local
    networks:
      external_network: null
      internal_network: null
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - type: volume
        source: dbserver-data
        target: /home/scv2/volume
        volume: {}
  expresso_server:
    container_name: expresso_server
    depends_on:
      celery_worker:
        condition: service_started
        required: true
      mongo:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true
    environment:
      PF_APIGATEWAY: "true"
      PF_CONTROL_SERVER_HOST: realtime
      PF_CONTROL_SERVER_PORT: "8181"
      PF_CONTROL_SERVER_URL: ""
      PF_DBSERVER_HOST: dbserver
      PF_DBSERVER_PORT: "8050"
      PF_DBSERVER_URL: ""
      PF_DBSERVER_VOLUME_DATA_PATH: /home/scv2/dbserver_volume/data
      PF_EXPRESSO_PUBLIC_URL_BASE: ""
      PF_IDLE_ARCHIVE_ENABLED: "true"
      PF_MONGO_HOST: mongo_exp
      PF_RDB_URL: http://relational_dbserver:8282
      PF_REDIS_HOST: redis
      PF_REMOTE_TRAINER_URLS: ""
      PF_ROOT_PATH: /api/expresso
      PF_SOCIAL_VIDEO_SERVER_HOST: social_video_server
      PF_SOCIAL_VIDEO_SERVER_PORT: "9999"
      PF_SOCIAL_VIDEO_SERVER_URL: ""
      PF_UISERVER_URL: http://auditgui:80
    hostname: expresso_server
    image: pacefactory/expresso_server:latest-gpu
    logging:
      driver: local
    networks:
      expresso_network: null
      external_network: null
    restart: always
    volumes:
      - type: volume
        source: expresso-data
        target: /home/scv2/volume
        volume: {}
      - type: volume
        source: dbserver-data
        target: /home/scv2/dbserver_volume
        read_only: true
        volume: {}
  expresso_ui:
    container_name: expresso_ui
    depends_on:
      expresso_server:
        condition: service_started
        required: true
      realtime:
        condition: service_started
        required: false
    environment:
      PF_APE_URL: ""
      PF_APIGATEWAY: "true"
      PF_CONTROL_SERVER_URL: ""
      PF_EXPRESSO_SERVER_HOST: ""
      PF_EXPRESSO_SERVER_PORT: "8456"
      PF_EXPRESSO_SERVER_URL: ""
      PF_GIF_URL: ""
      PF_MQTT_HOST: ""
      PF_MQTT_URL: ""
      PF_MQTT_WEBSOCKETS_PORT: "7575"
      PF_PASSWORD_PROTECTION: "true"
    hostname: expresso_ui
    image: pacefactory/expresso_ui:latest
    logging:
      driver: local
    networks:
      external_network: null
    restart: always
  mongo:
    command:
      - mongod
      - --quiet
      - --slowms
      - "200"
      - --wiredTigerCacheSizeGB
      - "1.5"
      - --replSet
      - rs0
      - --oplogSize
      - "2048"
    container_name: mongo
    deploy:
      resources:
        limits:
          memory: "4294967296"
    expose:
      - "27017"
    hostname: mongo
    healthcheck:
      test:
        - CMD
        - mongo
        - --quiet
        - --eval
        - |
          var self_host = getHostName() + ":27017";
          var status;
          try { status = rs.status(); } catch (rs_error) { status = rs_error; }
          if (status.ok === 1 && status.myState === 1) { quit(0); }
          if (status.code === 94) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: self_host }] });
          } else if (status.code === 93) {
            var cfg = db.getSiblingDB("local").system.replset.findOne();
            cfg.members = [{ _id: 0, host: self_host }];
            cfg.version += 1;
            db.adminCommand({ replSetReconfig: cfg, force: true });
          }
          quit(1);
      timeout: 10s
      interval: 15s
      retries: 5
      start_period: 1m30s
    image: mongo:4.2.3-bionic
    logging:
      driver: local
    networks:
      internal_network: null
    restart: always
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    volumes:
      - type: volume
        source: mongodata
        target: /data/db
        volume: {}
  mongo_exp:
    container_name: mongo_exp
    hostname: mongo_exp
    image: mongodb/mongodb-community-server:8.2.1-ubi8
    networks:
      expresso_network: null
    restart: always
    volumes:
      - type: volume
        source: mongodata_exp
        target: /data/db
        volume: {}
  nodered:
    container_name: nodered
    environment:
      SITE_NAME: site-name
    hostname: nodered
    image: nodered/node-red:4.0.5-22
    logging:
      driver: local
    networks:
      external_network: null
    ports:
      - mode: ingress
        target: 1880
        published: "1880"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: nodered-data
        target: /data
        volume: {}
  pf_mosquitto:
    container_name: pf_mosquitto
    hostname: pf_mosquitto
    healthcheck:
      test:
        - CMD
        - mosquitto_pub
        - -t
        - healthcheck/ping
        - -m
        - ok
        - -u
        - admin
        - -P
        - pfadminpw
      timeout: 5s
      interval: 10s
      retries: 3
    image: pacefactory/pf_mosquitto:latest
    logging:
      driver: local
    networks:
      external_network: null
    ports:
      - mode: ingress
        target: 1883
        published: "1883"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: mosquitto-data
        target: /mosquitto
        volume: {}
  realtime:
    container_name: realtime
    depends_on:
      data_interconnector:
        condition: service_started
        required: true
      pf_mosquitto:
        condition: service_started
        required: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
                - utility
                - compute
                - video
              driver: nvidia
              count: -1
    environment:
      DBSERVER_DOCKER_VOLUME_DATA_PATH: /home/scv2/dbserver_volume/data
      DBSERVER_HOST: dbserver
      MQTT_BROKER_HOST: pf_mosquitto
      MQTT_BROKER_PORT: "1883"
      REALTIME_APIGATEWAY: "true"
      REALTIME_PREFER_GPU: "true"
    hostname: realtime
    image: pacefactory/realtime:latest-gpu
    logging:
      driver: local
    networks:
      external_network: null
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - type: volume
        source: realtime-data
        target: /home/scv2/locations
        volume: {}
      - type: volume
        source: dbserver-data
        target: /home/scv2/dbserver_volume
        volume: {}
  record_video:
    profiles:
      - tools
    container_name: record_video
    entrypoint:
      - python3
      - /home/scv2/record_cli.py
    healthcheck:
      disable: true
    image: pacefactory/realtime:latest
    logging:
      driver: local
    networks:
      default: null
    restart: "no"
    user: root
    volumes:
      - type: volume
        source: realtime-data
        target: /home/scv2/locations
        volume: {}
      - type: bind
        source: /home/pacefactory/scv2/git_clones/deployment-scripts/record_cli.py
        target: /home/scv2/record_cli.py
        bind: {}
      - type: bind
        source: /home/pacefactory/scv2/videos
        target: /output_videos
        bind: {}
  redis:
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    container_name: redis
    hostname: redis
    image: redis:8.2.1-alpine
    networks:
      expresso_network: null
    restart: always
  relational_dbserver:
    container_name: relational_dbserver
    hostname: relational_dbserver
    image: pacefactory/relational-dbserver:latest
    logging:
      driver: local
    networks:
      external_network: null
    ports:
      - mode: ingress
        target: 8282
        published: "8282"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: relational_dbserver-data
        target: /home/scv2/volume
        volume: {}
  service_audit_processing:
    container_name: service_audit_processing
    depends_on:
      auditgui:
        condition: service_started
        required: true
      dbserver:
        condition: service_started
        required: true
      pf_mosquitto:
        condition: service_started
        required: true
      service_dtreeserver:
        condition: service_started
        required: true
    environment:
      PF_DBSERVER_URL: http://dbserver:8050
      PF_DEBUG: "false"
      PF_DTREE_CLASSIFIER_URL: http://service_dtreeserver:7272
      PF_ENABLE_SEGMENT_TRIM_STITCH: "false"
      PF_MQTT_URL: http://pf_mosquitto:1883
      PF_PROCESS_BLOCK_DURATION_MINUTES: "15"
      PF_PROCESS_BLOCK_LAG_MINUTES: "5"
      PF_PROCESS_BLOCK_MAX_LOOKBACK_MINUTES: "240"
      PF_PROCESS_BLOCK_PREVIOUS_MINUTES: "5"
      PF_RDB_URL: http://relational_dbserver:8282
      PF_REPORT_RANGE_HOURS: "168"
      PF_UISERVER_URL: http://auditgui:80
    image: pacefactory/service-audit-processing:latest
    logging:
      driver: local
    networks:
      external_network: null
    restart: always
    volumes:
      - type: volume
        source: audit_processing-data
        target: /home/scv2/volume
        volume: {}
  service_dtreeserver:
    container_name: service_dtreeserver
    depends_on:
      dbserver:
        condition: service_started
        required: true
    environment:
      DBSERVER_HOST: dbserver
    image: pacefactory/service-dtreeserver:latest
    logging:
      driver: local
    networks:
      external_network: null
    restart: always
    volumes:
      - type: volume
        source: service_dtreeserver-data
        target: /home/scv2/volume
        volume: {}
  service_gifwrapper:
    container_name: service_gifwrapper
    depends_on:
      dbserver:
        condition: service_started
        required: true
    environment:
      DBSERVER_DISABLE_SNAPSHOT_IMAGES: "true"
      DBSERVER_HOST: dbserver
      DBSERVER_VOLUME_DATA_PATH: /home/scv2/volume/data
    image: pacefactory/service-gifwrapper:latest
    logging:
      driver: local
    networks:
      external_network: null
    restart: always
    volumes:
      - type: volume
        source: dbserver-data
        target: /home/scv2/volume
        read_only: true
        volume: {}
  social_video_server:
    container_name: social_video_server
    environment:
      UISERVER_URL: auditgui:80
    hostname: social_video_server
    image: pacefactory/social_video_server:latest
    logging:
      driver: local
    networks:
      external_network: null
    ports:
      - mode: ingress
        target: 9999
        published: "9999"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: social_video_server-data
        target: /home/scv2/volume
        volume: {}
  social_web_app:
    container_name: social_web_app
    environment:
      SOCIAL_BACKEND_URL: /api/video
      SOCIAL_DBSERVER_URL: /api/dbserver
      SOCIAL_DEFAULT_GHOSTING_TYPE: ghosted
      SOCIAL_FORCE_GHOSTING: "true"
      SOCIAL_GIF_URL: /api/gif
      SOCIAL_SCV3_URL: /scv3/
      SOCIAL_UISERVER_URL: /api/uiserver
    hostname: social_web_app
    image: pacefactory/social_web_app:latest
    logging:
      driver: local
    networks:
      external_network: null
    restart: always
  stitch_videos:
    profiles:
      - tools
    container_name: stitch_videos
    entrypoint:
      - python3
      - /home/scv2/stitch_cli.py
    healthcheck:
      disable: true
    image: pacefactory/realtime:latest
    logging:
      driver: local
    network_mode: none
    restart: "no"
    user: root
    volumes:
      - type: bind
        source: /home/pacefactory/scv2/git_clones/deployment-scripts/stitch_cli.py
        target: /home/scv2/stitch_cli.py
        bind: {}
      - type: bind
        source: /home/pacefactory/scv2/videos
        target: /output_videos
        bind: {}
  trainer:
    container_name: trainer
    depends_on:
      mongo_exp:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
                - utility
                - compute
                - video
              driver: nvidia
              count: -1
    entrypoint:
      - ./scripts/start_worker.sh
    environment:
      PF_EXPRESSO_HOST: expresso_server
      PF_MONGO_HOST: mongo_exp
      PF_REDIS_HOST: redis
      PF_TRAINER_VOLUME_PATH: /home/scv2/volume
    hostname: trainer
    image: pacefactory/trainer:latest
    logging:
      driver: local
    networks:
      expresso_network: null
      external_network: null
    restart: always
    shm_size: "2147483648"
    volumes:
      - type: volume
        source: expresso-data
        target: /home/scv2/volume
        volume: {}
networks:
  default:
    name: deployment-scripts_default
  expresso_network:
    name: deployment-scripts_expresso_network
  external_network:
    name: deployment-scripts_external_network
  internal_network:
    name: deployment-scripts_internal_network
volumes:
  audit_processing-data:
    name: deployment-scripts_audit_processing-data
  data_interconnector-data:
    name: deployment-scripts_data_interconnector-data
  dbserver-data:
    name: deployment-scripts_dbserver-data
  expresso-data:
    name: deployment-scripts_expresso-data
  mongodata:
    name: deployment-scripts_mongodata
  mongodata_exp:
    name: deployment-scripts_mongodata_exp
  mosquitto-data:
    name: deployment-scripts_mosquitto-data
  nodered-data:
    name: deployment-scripts_nodered-data
  realtime-data:
    name: deployment-scripts_realtime-data
  relational_dbserver-data:
    name: deployment-scripts_relational_dbserver-data
  service_dtreeserver-data:
    name: deployment-scripts_service_dtreeserver-data
  social_video_server-data:
    name: deployment-scripts_social_video_server-data
  webgui-data:
    name: deployment-scripts_webgui-data
x-pf-info:
  description: Tools profile contains useful utilities that can be run on-demand with `docker compose run tool_name ...`
  name: Tools profile
  prompt: Enable the social profile?
  settings:
    APIGATEWAY_TAG:
      default: latest
    AUDIT_PROCESSING_TAG:
      default: latest
    AUDITGUI_TAG:
      default: latest
    DATA_INTERCONNECTOR_TAG:
      default: latest
    DBSERVER_DISABLE_SNAPSHOT_IMAGES:
      default: true
      description: Disable unghosted snapshot image endpoints in dbserver (hard ghosting enforcement)
    DBSERVER_TAG:
      default: latest
    DTREESERVER_TAG:
      default: latest
    EXPRESSO_SERVER_TAG:
      default: latest
      default_var: EXPRESSO_SERVER_TAG_DEFAULT_GPU
    EXPRESSO_SERVER_TAG_DEFAULT_GPU:
      default: latest-gpu
      hidden: true
    EXPRESSO_UI_PASSWORD_PROTECTION:
      default: true
      description: Enable Expresso UI password protection (true/false)
    EXPRESSO_UI_TAG:
      default: latest
    GIFWRAPPER_TAG:
      default: latest
    HTTP_PORT:
      default: 80
    MONGO_MEMORY_LIMIT:
      default: 3g
      default_var: MONGO_MEMORY_LIMIT_DEFAULT
      description: Hard memory limit for the mongo container, with units (e.g. 3g). Default scales with host RAM; see docs/reference/mongodb.md for sizing guidance
    MONGO_OPLOG_SIZE_MB:
      default: 2048
      description: Maximum size (in MB) of the MongoDB replica set oplog
    MONGO_WIREDTIGER_CACHE_GB:
      default: 1
      default_var: MONGO_WIREDTIGER_CACHE_GB_DEFAULT
      description: MongoDB WiredTiger cache size in GB. Rule of thumb is 50% of (MONGO_MEMORY_LIMIT - 1GB). Default scales with host RAM
    NODERED_PORT:
      default: 1880
    NODERED_SITE_NAME:
      default: site-name
    NODERED_TAG:
      default: 4.0.5-22
    PF_ENABLE_SEGMENT_TRIM_STITCH:
      default: false
      description: Globally enable per-entry segment trimming, stitching, and derived source-data lookback in audit processing (true/false)
    PF_EXPRESSO_PUBLIC_URL_BASE:
      default: ""
      description: Public URL other deployments use to reach this one for remote-training callbacks, including scheme and the /api/expresso prefix (e.g. https://site.example.com/api/expresso). Leave blank if this deployment will not dispatch training to a remote.
    PF_IDLE_ARCHIVE_ENABLED:
      default: true
      description: Enable the scheduled idle-object snapshot archiving task (true/false). Per-site kill switch; disabled means the task exits immediately without calling gifwrapper.
    PF_MOSQUITTO_PUBLIC_PORT:
      default: 1883
    PF_MOSQUITTO_TAG:
      default: latest
    PF_PROCESS_BLOCK_DURATION_MINUTES:
      default: 15
      description: Size of blocks audit processing will compute (minutes)
    PF_PROCESS_BLOCK_LAG_MINUTES:
      default: 5
      description: Duration to wait after end of a processing block for late-arriving data to arrive in dbserver (minutes)
    PF_PROCESS_BLOCK_MAX_LOOKBACK_MINUTES:
      default: 240
      description: Upper bound on the per-entry source-data lookback derived from duration parameters in each entry's dependency chain (minutes)
    PF_PROCESS_BLOCK_PREVIOUS_MINUTES:
      default: 5
      description: Duration of redundant/overlapping data precedeing each processing block's start time (minutes)
    PF_REMOTE_TRAINER_URLS:
      default: ""
      description: Optional comma-separated remote Expresso base URLs to pre-register as remote trainers (e.g. https://siteB.example.com/api/expresso,https://siteC.example.com/api/expresso). Leave blank to add them later via the UI/API.
    PF_REPORT_RANGE_HOURS:
      default: 168
      description: Time window audit processing will compute retroactively (hours)
    PROJECT_PREFIX:
      default: ""
    RDB_PUBLIC_PORT:
      default: "8282"
    RDB_TAG:
      default: latest
    REALTIME_TAG:
      default: latest
      default_var: REALTIME_TAG_DEFAULT_GPU
    REALTIME_TAG_DEFAULT_GPU:
      default: latest-gpu
      hidden: true
    SOCIAL_VIDEO_PUBLIC_PORT:
      default: "9999"
    SOCIAL_VIDEO_SERVER_TAG:
      default: latest
    SOCIAL_WEB_APP_TAG:
      default: latest
    TRAINER_SHM_SIZE:
      default: 2gb
      description: Shared memory (/dev/shm) size for the trainer container. Increase if PyTorch DataLoader deadlocks (e.g. 4gb, 8gb).
    TRAINER_TAG:
      default: latest
    WEBGUI_DEFAULT_GHOSTING_TYPE:
      default: ghosted
      description: 'Ghosting style the webgui starts with. One of: no_image, edges, edges_inverted, ghosted, ghosted_blur, color_invert'
    WEBGUI_FORCE_GHOSTING:
      default: true
      description: Force ghosting of all cameras
    WEBGUI_UNGHOSTED_CAMERA_LIST:
      default: ""
      description: List of cameras that should not be ghosted. Should be a comma separated list of camera names
  sub-profile: true
  sub-profiles:
    - cuda
    - mqtt-public
    - expresso-020-cuda
    - expresso-030-trainer
